<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d62828">
<meta name="robots" content="noindex,follow">
<title>Souviks</title>
<link rel="icon" type="image/png" href="/assets/favicon/favicon-32x32.png">
<link rel="preload" as="image" href="/assets/images/souviks-loading-logo.png" fetchpriority="high">
<style>
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#fff,#f5f6f7);color:#243042;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.souviks-loader{width:min(92vw,420px);padding:34px 30px 30px;border:1px solid #e5e7eb;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 18px 55px rgba(36,48,66,.12);text-align:center}
.souviks-loader-mark{width:184px;height:184px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(36,48,66,.09)}
.souviks-loader-mark img{width:152px;height:152px;display:block;object-fit:contain}
.souviks-loader-title{margin:0;font-size:1.45rem;line-height:1.25;font-weight:700}
.souviks-loader-subtitle{margin:8px 0 20px;color:#6b7280;font-size:.93rem}
.souviks-loader-dots{display:inline-flex;gap:7px}
.souviks-loader-dots span{width:8px;height:8px;border-radius:50%;background:#d62828;animation:souviks-loader-dot 1.1s ease-in-out infinite}
.souviks-loader-dots span:nth-child(2){animation-delay:.14s}.souviks-loader-dots span:nth-child(3){animation-delay:.28s}
.souviks-loader-fallback{margin-top:18px;font-size:.8rem;color:#6b7280}
.souviks-loader-fallback a{color:#b71c1c;font-weight:600;text-decoration:none}
@keyframes souviks-loader-dot{0%,100%{transform:translateY(0);opacity:.28}50%{transform:translateY(-3px);opacity:1}}
@media(prefers-reduced-motion:reduce){.souviks-loader-dots span{animation:none}}
</style>
</head>
<body>
<main class="souviks-loader" aria-live="polite" aria-busy="true">
<div class="souviks-loader-mark" aria-hidden="true">
<img src="/assets/images/souviks-loading-logo.png" width="152" height="152" alt="">
</div>
<h1 class="souviks-loader-title">Welcome to Souviks</h1>
<p class="souviks-loader-subtitle">Preparing your catalogue…</p>
<div class="souviks-loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="souviks-loader-fallback"><noscript>JavaScript is required for automatic language selection. <a href="/en/">Continue in English</a></noscript></div>
</main>
<script>
(function(){
const supported=["en","bn","hi"],fallback="en";
function saved(){try{return String(localStorage.getItem("svks_language")||"").trim().toLowerCase()}catch(e){return""}}
function remember(lang){try{localStorage.setItem("svks_language",lang)}catch(e){}}
function resolve(){
const stored=saved();if(supported.includes(stored))return stored;
const candidates=Array.isArray(navigator.languages)&&navigator.languages.length?navigator.languages:[navigator.language];
for(const value of candidates){const lang=String(value||"").toLowerCase().split("-")[0];if(supported.includes(lang))return lang}
return fallback;
}
function go(){
const lang=resolve();remember(lang);
const origin=window.location.hostname==="souviks.co.in"?"https://www.souviks.co.in":window.location.origin;
window.location.replace(origin+"/"+lang+"/");
}
requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(go,120)));
})();
</script>
</body>
</html>
