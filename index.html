<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Souviks</title>

<script>

(function () {

    const supported = ["en", "bn", "hi"];

    let language =
        localStorage.getItem(
            "svks_language"
        );

    if (!language) {

        language =
            navigator.language
                .toLowerCase()
                .split("-")[0];

    }

    if (!supported.includes(language)) {

            language = "en";

    }

    window.location.replace(

        "/" + language + "/"

    );

})();

</script>

</head>
