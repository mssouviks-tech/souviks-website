name: Diagnose Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "diagnostics/**"
  workflow_dispatch:
    inputs:
      account_id:
        description: "Cloudflare Account ID (optional)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id || 'd88f7d40c65eb68eea794b8e6cee7379' }}
      REPO_OWNER: "mssouviks-tech"
      REPO_NAME: "souviks-website"
      DIAGNOSTIC_FILE: "diagnostics/cloudflare-pages-diagnostic.md"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Query Cloudflare Pages safely
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          {
            echo "# Cloudflare Pages Diagnostic"
            echo
            echo "- Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "- GitHub repository: ${REPO_OWNER}/${REPO_NAME}"
            echo "- Cloudflare account: ${CLOUDFLARE_ACCOUNT_ID}"
            echo
            echo "## Credential check"
            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              echo "Cloudflare token: **MISSING**"
              echo
              echo "The GitHub Actions secret \`CLOUDFLARE_API_TOKEN\` is not available to this workflow."
            else
              echo "Cloudflare token: **PRESENT** (secret value is not printed)"
            fi
            echo

            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              exit 0
            fi

            echo "## Pages project API response"
            HTTP_STATUS=$(curl -sS -o /tmp/pages-projects.json -w "%{http_code}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=100" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "HTTP status: ${HTTP_STATUS}"
            echo
            if jq -e '.success == true' /tmp/pages-projects.json >/dev/null 2>&1; then
              echo "API success: **true**"
            else
              echo "API success: **false**"
              echo
              echo "API error payload (token value is not included):"
              jq '{success, errors, messages}' /tmp/pages-projects.json 2>/dev/null || cat /tmp/pages-projects.json
              exit 0
            fi
            echo

            echo "## Matching Pages projects"
            MATCHES="$(jq -c --arg owner "${REPO_OWNER}" --arg repo "${REPO_NAME}" '
              .result[]
              | select(
                  ((.source.config.owner? // "") == $owner)
                  and ((.source.config.repo_name? // "") == $repo)
                )
              | {
                  name,
                  id,
                  subdomain,
                  production_branch: (.source.config.production_branch? // null),
                  production_deployments_enabled: (.source.config.production_deployments_enabled? // null),
                  preview_deployment_setting: (.source.config.preview_deployment_setting? // null),
                  canonical_deployment_id: (.canonical_deployment.id? // null)
                }
            ' /tmp/pages-projects.json)"

            if [ -z "${MATCHES}" ]; then
              echo "No Pages project matched the repository metadata exactly."
              echo
              echo "Visible Pages projects:"
              jq -r '.result[] | "- " + (.name // "unknown") + " | branch=" + ((.source.config.production_branch? // "unknown")|tostring) + " | repo=" + ((.source.config.owner? // "unknown")|tostring) + "/" + ((.source.config.repo_name? // "unknown")|tostring)' /tmp/pages-projects.json
              exit 0
            fi

            echo "${MATCHES}" | while IFS= read -r project; do
              PROJECT_NAME="$(echo "${project}" | jq -r '.name')"
              echo "### Project: ${PROJECT_NAME}"
              echo
              echo "```json"
              echo "${project}" | jq .
              echo "```"
              echo

              STATUS=$(curl -sS -o "/tmp/${PROJECT_NAME}-project.json" -w "%{http_code}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json")
              echo "Project API HTTP status: ${STATUS}"
              echo
              jq '.result | {
                name,
                subdomain,
                source,
                build_config,
                deployment_configs,
                canonical_deployment,
                latest_deployment
              }' "/tmp/${PROJECT_NAME}-project.json"
              echo

              STATUS=$(curl -sS -o "/tmp/${PROJECT_NAME}-deployments.json" -w "%{http_code}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments?env=production&per_page=10" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json")
              echo "## Recent production deployments"
              echo "Deployments API HTTP status: ${STATUS}"
              echo
              jq -r '
                .result[]
                | [
                    (.created_on // ""),
                    (.latest_stage.status // ""),
                    (.deployment_trigger.type // ""),
                    (.deployment_trigger.metadata.branch // ""),
                    (.deployment_trigger.metadata.commit_hash // ""),
                    (.deployment_trigger.metadata.commit_message // ""),
                    (.uses_functions // false),
                    (.id // ""),
                    (.url // "")
                  ]
                | @tsv
              ' "/tmp/${PROJECT_NAME}-deployments.json" 2>/dev/null | while IFS=$'\t' read -r created status trigger branch commit message uses_functions id url; do
                echo "- created=${created}; status=${status}; trigger=${trigger}; branch=${branch}; commit=${commit}; uses_functions=${uses_functions}; deployment_id=${id}"
                echo "  message: ${message}"
                echo "  url: ${url}"
              done
              echo

              echo "## Custom domains"
              STATUS=$(curl -sS -o "/tmp/${PROJECT_NAME}-domains.json" -w "%{http_code}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json")
              echo "Domains API HTTP status: ${STATUS}"
              jq -r '.result[] | "- " + (.name // "unknown") + " | status=" + ((.status // "unknown")|tostring)' "/tmp/${PROJECT_NAME}-domains.json" 2>/dev/null
              echo
            done
          } | tee "${DIAGNOSTIC_FILE}" | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0

      - name: Publish diagnostic to PR conversation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 17 --repo "${GITHUB_REPOSITORY}" --body-file "${DIAGNOSTIC_FILE}"
