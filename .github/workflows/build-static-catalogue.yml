name: Build Static Catalogue

on:
  push:
    branches:
      - main
    paths:
      - "assets/data/catalogue-index.json"
      - "assets/data/catalogue_overrides.json"
      - "assets/data/products.json"
      - "assets/data/search.json"
      - "assets/images/products/**"
      - "en/products/**"
      - "bn/products/**"
      - "hi/products/**"
      - "scripts/catalogue/build.py"
      - "scripts/catalogue/enrich_entities.py"
      - "scripts/catalogue/sync_entity_sitemaps.py"
      - "scripts/audit/critical_build.py"
      - "assets/data/brands.json"
      - "assets/data/categories.json"
      - "assets/data/vehicles.json"
      - "en/brands/**"
      - "hi/brands/**"
      - "bn/brands/**"
      - "en/categories/**"
      - "hi/categories/**"
      - "bn/categories/**"
      - "en/vehicles/**"
      - "hi/vehicles/**"
      - "bn/vehicles/**"
      - "en/about.html"
      - "hi/about.html"
      - "bn/about.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    concurrency:
      group: souviks-main-publisher
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile catalogue builders
        run: |
          python3 - <<'PY'
          import py_compile
          for path in (
              "scripts/catalogue/build.py",
              "scripts/catalogue/enrich_entities.py",
              "scripts/catalogue/sync_entity_sitemaps.py",
              "scripts/catalogue/validate.py",
              "scripts/audit/critical_build.py",
              "scripts/audit/structured_data.py",
          ):
              py_compile.compile(path, cfile="/tmp/" + path.replace("/", "_") + ".pyc", doraise=True)
          print("Python syntax OK")
          PY

      - name: Build and validate publication candidate
        shell: bash
        run: |
          set -euo pipefail

          prepare_candidate() {
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/build.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/sync_entity_sitemaps.py
            python3 scripts/audit/critical_build.py
            python3 scripts/audit/structured_data.py
            python3 scripts/js/validate.py
            node --check assets/js/site-core.js
            for file in assets/js/bundles/*.js; do
              node --check "$file"
            done
          }

          prepare_candidate

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Catalogue publish attempt ${attempt}"

            git add -A
            if git diff --cached --quiet; then
              echo "Catalogue is already synchronized."
              exit 0
            fi

            git commit -m "Build static catalogue"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote main advanced; rebuilding from the latest main before retry."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/build.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/sync_entity_sitemaps.py
            python3 scripts/audit/critical_build.py
            python3 scripts/audit/structured_data.py
            python3 scripts/js/validate.py
            node --check assets/js/site-core.js
            for file in assets/js/bundles/*.js; do
              node --check "$file"
            done
          done

          echo "Unable to publish the generated catalogue after 8 attempts."
          exit 1

      - name: Remove Python bytecode
        run: find scripts -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Catalogue is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/catalogue/enrich_entities.py
              python3 scripts/catalogue/build.py
              find scripts -type d -name "__pycache__" -prune -exec rm -rf {} +
            fi

            git add -A
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Build static catalogue"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            git reset --hard origin/main
            sleep 3
          done

          echo "Unable to push the generated catalogue after 8 attempts."
          exit 1
