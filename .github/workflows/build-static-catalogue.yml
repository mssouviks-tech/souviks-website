name: Build Static Catalogue

on:
  push:
    branches:
      - main
    paths:
      - "assets/data/catalogue-index.json"
      - "assets/data/catalogue_overrides.json"
      - "assets/data/products.json"
      - "assets/data/search.json"
      - "assets/images/products/**"
      - "en/products/**"
      - "bn/products/**"
      - "hi/products/**"
      - "scripts/catalogue/build.py"
      - "scripts/catalogue/enrich_entities.py"
      - "scripts/catalogue/sync_entity_sitemaps.py"
      - "scripts/audit/critical_build.py"
      - "scripts/audit/performance_guard.py"
      - "scripts/audit/optimize_static_images.py"
      - "scripts/audit/generate_product_thumbnails.py"
      - "assets/images/product-thumbnails/**"
      - "package.json"
      - "scripts/js/**"
      - "assets/data/brands.json"
      - "assets/data/categories.json"
      - "assets/data/vehicles.json"
      - "assets/js/**"
      - "assets/css/**"
      - "scripts/catalogue/navigation.py"
      - "scripts/catalogue/sync_navigation.py"
      - "scripts/catalogue/product_card.py"
      - "scripts/catalogue/sync_product_cards.py"
      - "scripts/audit/structured_data.py"
      - "scripts/audit/site_quality.py"
      - "scripts/audit/code_quality.py"
      - "eslint.config.js"
      - ".prettierrc.json"
      - "docs/code-architecture.md"
      - ".github/workflows/**"
      - "en/brands/**"
      - "hi/brands/**"
      - "bn/brands/**"
      - "en/categories/**"
      - "hi/categories/**"
      - "bn/categories/**"
      - "en/vehicles/**"
      - "hi/vehicles/**"
      - "bn/vehicles/**"
      - "en/about.html"
      - "hi/about.html"
      - "bn/about.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    concurrency:
      group: souviks-main-publisher
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image optimisation dependency
        run: python3 -m pip install --user --break-system-packages Pillow

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JavaScript build tools
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Compile catalogue builders
        run: |
          python3 - <<'PY'
          import py_compile
          for path in (
              "scripts/catalogue/build.py",
              "scripts/catalogue/normalize_page_config.py",
              "scripts/catalogue/sync_rfq_module.py",
              "scripts/catalogue/enrich_entities.py",
              "scripts/catalogue/sync_entity_sitemaps.py",
              "scripts/catalogue/validate.py",
              "scripts/catalogue/navigation.py",
              "scripts/catalogue/sync_navigation.py",
              "scripts/catalogue/product_card.py",
              "scripts/catalogue/sync_product_cards.py",
              "scripts/audit/critical_build.py",
              "scripts/audit/performance_guard.py",
              "scripts/audit/optimize_static_images.py",
              "scripts/audit/generate_product_thumbnails.py",
              "scripts/audit/production_smoke.py",
              "scripts/audit/structured_data.py",
              "scripts/js/refactor.py",
              "scripts/js/refresh_versions.py",
          ):
              py_compile.compile(path, cfile="/tmp/" + path.replace("/", "_") + ".pyc", doraise=True)
          print("Python syntax OK")
          PY

      - name: Build and validate publication candidate
        shell: bash
        run: |
          set -euo pipefail

          run_candidate_checks() {
            python3 scripts/catalogue/validate.py
            python3 scripts/audit/critical_build.py
            python3 scripts/audit/structured_data.py
            python3 scripts/audit/site_quality.py
            python3 scripts/js/validate.py
            python3 scripts/audit/code_quality.py
            python3 scripts/audit/performance_guard.py
            npm run lint:js
            npm run check:js
            npm run format:check
            git diff --check
          }

          prepare_candidate() {
            python3 scripts/audit/optimize_static_images.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/build.py
            python3 scripts/audit/generate_product_thumbnails.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/normalize_page_config.py
            python3 scripts/catalogue/sync_rfq_module.py
            python3 scripts/catalogue/sync_navigation.py
            python3 scripts/catalogue/sync_product_cards.py
            python3 scripts/catalogue/sync_entity_sitemaps.py
            python3 scripts/js/refactor.py
            npm run build:js
            python3 scripts/audit/optimize_static_images.py
            python3 scripts/js/refresh_versions.py
            run_candidate_checks
          }

          prepare_candidate

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This step runs in a separate shell from candidate validation.
          # Re-declare the full gate so remote-main retry attempts are validated too.
          run_candidate_checks() {
            python3 scripts/catalogue/validate.py
            python3 scripts/audit/critical_build.py
            python3 scripts/audit/structured_data.py
            python3 scripts/audit/site_quality.py
            python3 scripts/js/validate.py
            python3 scripts/audit/code_quality.py
            python3 scripts/audit/performance_guard.py
            npm run lint:js
            npm run check:js
            npm run format:check
            git diff --check
          }

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Catalogue publish attempt ${attempt}"

            find scripts -type d -name "__pycache__" -prune -exec rm -rf {} +

            git add -A
            if git diff --cached --quiet; then
              echo "Catalogue is already synchronized."
              exit 0
            fi

            git commit -m "Build static catalogue"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote main advanced; rebuilding from the latest main before retry."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Reinstall tooling after the retry reset so publication does not depend on cached dependencies.
            npm install --no-package-lock --no-audit --no-fund

            python3 scripts/audit/optimize_static_images.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/build.py
            python3 scripts/audit/generate_product_thumbnails.py
            python3 scripts/catalogue/enrich_entities.py
            python3 scripts/catalogue/normalize_page_config.py
            python3 scripts/catalogue/sync_rfq_module.py
            python3 scripts/catalogue/sync_navigation.py
            python3 scripts/catalogue/sync_product_cards.py
            python3 scripts/catalogue/sync_entity_sitemaps.py
            python3 scripts/js/refactor.py
            npm run build:js
            python3 scripts/audit/optimize_static_images.py
            python3 scripts/js/refresh_versions.py
            run_candidate_checks
          done

          echo "Unable to publish the generated catalogue after 8 attempts."
          exit 1
