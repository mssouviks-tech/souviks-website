name: Build Static Catalogue

on:
  push:
    branches:
      - main
    paths:
      - "assets/data/catalogue-index.json"
      - "assets/data/catalogue_overrides.json"
      - "assets/data/products.json"
      - "assets/data/search.json"
      - "assets/images/products/**"
      - "en/products/**"
      - "bn/products/**"
      - "hi/products/**"
      - "scripts/catalogue/build.py"
      - "scripts/catalogue/enrich_entities.py"
      - "assets/data/brands.json"
      - "assets/data/categories.json"
      - "assets/data/vehicles.json"
      - "en/brands/**"
      - "hi/brands/**"
      - "bn/brands/**"
      - "en/categories/**"
      - "hi/categories/**"
      - "bn/categories/**"
      - "en/vehicles/**"
      - "hi/vehicles/**"
      - "bn/vehicles/**"
      - "en/about.html"
      - "hi/about.html"
      - "bn/about.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    concurrency:
      group: souviks-catalogue-build
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile catalogue builders
        run: python3 -m py_compile scripts/catalogue/build.py scripts/catalogue/enrich_entities.py scripts/catalogue/validate.py

      - name: Enrich entity and trust content
        run: python3 scripts/catalogue/enrich_entities.py

      - name: Build static catalogue
        run: python3 scripts/catalogue/build.py

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Catalogue is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build static catalogue"
          git push origin HEAD:main
