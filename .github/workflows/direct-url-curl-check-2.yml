name: Direct URL Curl Check 2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  curl-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run direct curl checks
        shell: bash
        run: |
          urls=(
            "https://www.souviks.co.in/en/products/12-x-15-nut"
            "https://www.souviks.co.in/en/products/12-X-15-NUT"
            "https://www.souviks.co.in/en/products/12%20X%2015%20Nut"
            "https://www.souviks.co.in/en/products/12-x-15-nut/"
            "https://www.souviks.co.in/en/products/12-x-15-nut.HTML"
            "https://www.souviks.co.in/en/products/12-X-15-NUT.HTML"
            "https://www.souviks.co.in/en/products/12%20X%2015%20Nut.HTML"
            "https://www.souviks.co.in/en/products/"
            "https://www.souviks.co.in/en/products"
            "https://www.souviks.co.in/en/products/does-not-exist-xyz"
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -sIL --path-as-is --max-time 30 --connect-timeout 15 "$u" || true
            echo
          done
