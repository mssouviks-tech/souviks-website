name: Refresh shared JavaScript cache versions

on:
  push:
    branches: [main]
    paths:
      - "assets/js/site-core.js"
      - "assets/js/catalogue-core.js"
      - "scripts/js/refresh_versions.py"

permissions:
  contents: write

concurrency:
  group: souviks-shared-js-versions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh cache-busting hashes in every locale page
        run: python3 scripts/js/refresh_versions.py

      - name: Commit refreshed page references
        shell: bash
        run: |
          set -euo pipefail
          git add 404.html en hi bn
          if git diff --cached --quiet; then
            echo "All shared JavaScript cache hashes are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh shared JavaScript cache versions"
          git push
