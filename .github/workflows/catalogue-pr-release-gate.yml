name: Catalogue PR Release Gate

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - "docs/**"
      - "_headers"
      - "_redirects"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemaps/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"

permissions:
  contents: read

concurrency:
  group: souviks-catalogue-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno for Supabase Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Cashfree Edge Function types
        run: deno check supabase/functions/_shared/cashfree.ts supabase/functions/cashfree-create-order/index.ts supabase/functions/cashfree-verify-order/index.ts supabase/functions/cashfree-webhook/index.ts supabase/functions/account-orders/index.ts

      - name: Check Delhivery Edge Function types
        run: deno check supabase/functions/delhivery-estimate/index.ts

      - name: Install JavaScript build tools
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install image optimisation dependency
        run: python3 -m pip install --user --break-system-packages Pillow

      - name: Compile catalogue builders
        run: |
          python3 - <<'PY'
          import py_compile
          for path in (
              "scripts/catalogue/build.py",
              "scripts/catalogue/product_seo.py",
              "scripts/catalogue/product_title.py",
              "scripts/audit/test_product_seo.py",
              "scripts/audit/test_product_title.py",
              "scripts/audit/test_wabco_product_specs.py",
              "scripts/audit/test_pin_product_specs.py",
              "scripts/audit/test_static_product_pricing.py",
              "scripts/audit/test_product_checkout_actions.py",
              "scripts/audit/test_navigation_dropdowns.py",
              "scripts/audit/test_seo_contract.py",
              "scripts/audit/test_entity_titles.py",
              "scripts/audit/test_vehicle_page_layout.py",
              "scripts/catalogue/normalize_page_config.py",
              "scripts/catalogue/sync_rfq_module.py",
              "scripts/catalogue/sync_product_actions.py",
              "scripts/catalogue/sync_checkout_pages.py",
              "scripts/catalogue/sync_checkout_module.py",
              "scripts/catalogue/sync_delhivery_module.py",
              "scripts/audit/production_smoke.py",
              "scripts/catalogue/enrich_entities.py",
              "scripts/catalogue/sync_entity_sitemaps.py",
              "scripts/catalogue/validate.py",
              "scripts/catalogue/navigation.py",
              "scripts/catalogue/sync_navigation.py",
              "scripts/catalogue/product_card.py",
              "scripts/catalogue/sync_product_cards.py",
              "scripts/audit/generate_product_thumbnails.py",
              "scripts/catalogue/sync_root_homepage.py",
              "scripts/audit/catalogue_parity.py",
              "scripts/audit/critical_build.py",
              "scripts/audit/performance_guard.py",
              "scripts/audit/optimize_static_images.py",
              "scripts/audit/structured_data.py",
              "scripts/audit/seo_contract.py",
              "scripts/audit/site_quality.py",
              "scripts/audit/code_quality.py",
              "scripts/js/refactor.py",
              "scripts/js/validate.py",
              "scripts/js/refresh_versions.py",
          ):
              py_compile.compile(
                  path,
                  cfile="/tmp/" + path.replace("/", "_") + ".pyc",
                  doraise=True,
              )
          print("Python syntax OK")
          PY

      - name: Build and validate candidate
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/audit/optimize_static_images.py
          python3 scripts/catalogue/enrich_entities.py
          python3 scripts/catalogue/build.py
          python3 scripts/catalogue/sync_checkout_pages.py
          python3 scripts/audit/generate_product_thumbnails.py
          python3 scripts/catalogue/sync_navigation.py
          python3 scripts/catalogue/sync_product_cards.py
          python3 scripts/catalogue/enrich_entities.py
          python3 scripts/catalogue/normalize_page_config.py
          python3 scripts/catalogue/sync_rfq_module.py
          python3 scripts/catalogue/sync_product_actions.py
          python3 scripts/catalogue/sync_checkout_module.py
          python3 scripts/catalogue/sync_delhivery_module.py
          python3 scripts/catalogue/sync_entity_sitemaps.py
          python3 scripts/js/refactor.py
          npm run build:js
          python3 scripts/audit/optimize_static_images.py
          python3 scripts/js/refresh_versions.py
          python3 scripts/catalogue/sync_root_homepage.py

          python3 scripts/catalogue/validate.py
          python3 scripts/audit/test_product_weight_estimates.py
          python3 scripts/audit/test_wabco_product_specs.py
          python3 scripts/audit/test_pin_product_specs.py
          python3 scripts/audit/critical_build.py
          python3 scripts/audit/test_static_product_pricing.py
            python3 scripts/audit/test_product_checkout_actions.py
          python3 scripts/audit/test_navigation_dropdowns.py
          python3 scripts/audit/test_product_seo.py
          python3 scripts/audit/test_product_title.py
          python3 scripts/audit/test_seo_contract.py
          python3 scripts/audit/test_entity_titles.py
          python3 scripts/audit/test_vehicle_page_layout.py
          python3 scripts/audit/structured_data.py
          python3 scripts/audit/seo_contract.py --report-file seo-review-report.json
          python3 scripts/audit/site_quality.py
          python3 scripts/audit/code_quality.py
          python3 scripts/audit/performance_guard.py
          python3 scripts/js/validate.py

          git diff --check

          npm run lint:js
          npm run check:js
          node scripts/regression/rfq-security-contract.cjs
          node scripts/regression/cashfree-checkout-contract.cjs
          node scripts/regression/delhivery-estimate-contract.cjs
          npm run format:check

          echo "Catalogue release gate passed."

      - name: Upload SEO review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-review-report-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: seo-review-report.json
          if-no-files-found: warn
          retention-days: 14
