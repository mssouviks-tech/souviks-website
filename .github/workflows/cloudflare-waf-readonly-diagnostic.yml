name: Cloudflare WAF Read-only Diagnostic

on:
  push:
    branches:
      - diag/cloudflare-waf-readonly-20261011

permissions:
  contents: read

jobs:
  inspect-zone-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect scoped Cloudflare API access without printing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const candidates = [
            ["CLOUDFLARE_API_TOKEN", process.env.CLOUDFLARE_API_TOKEN],
            ["CF_API_TOKEN", process.env.CF_API_TOKEN],
            ["CLOUDFLARE_TOKEN", process.env.CLOUDFLARE_TOKEN],
            ["CF_TOKEN", process.env.CF_TOKEN],
          ];
          const selected = candidates.find(([, value]) => Boolean(value && value.trim()));
          if (!selected) {
            console.log("NO_SCOPED_CLOUDFLARE_API_TOKEN: checked common repository secret names; no credential values were printed.");
            process.exit(0);
          }

          const [, token] = selected;
          console.log("Scoped API credential detected under secret name:", selected[0]);
          const base = "https://api.cloudflare.com/client/v4";
          async function api(path) {
            const response = await fetch(base + path, {
              headers: { Authorization: "Bearer " + token, Accept: "application/json" },
              signal: AbortSignal.timeout(12000),
            });
            let payload = null;
            try { payload = await response.json(); } catch {}
            return { status: response.status, ok: response.ok && payload?.success === true, payload };
          }
          const zoneId = process.env.CLOUDFLARE_ZONE_ID || process.env.CF_ZONE_ID || "";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || process.env.CF_ACCOUNT_ID || "d88f7d40c65eb68eea794b8e6cee7379";
          console.log("Configured identifiers:", {
            zoneIdPresent: Boolean(zoneId),
            accountIdPresent: Boolean(accountId),
          });

          let zone = null;
          if (zoneId) {
            const zoneResponse = await api("/zones/" + encodeURIComponent(zoneId));
            console.log("Direct zone lookup HTTP:", zoneResponse.status, "API success:", zoneResponse.ok);
            if (zoneResponse.ok && zoneResponse.payload.result?.name === "souviks.co.in") {
              zone = zoneResponse.payload.result;
            } else if (!zoneResponse.ok) {
              console.log("Direct zone lookup error codes:", (zoneResponse.payload?.errors || []).map(e => e.code));
            }
          }

          if (!zone) {
            const zoneResponse = await api("/zones?per_page=50");
            console.log("Accessible-zone listing HTTP:", zoneResponse.status, "API success:", zoneResponse.ok);
            if (!zoneResponse.ok) {
              console.log("Accessible-zone listing error codes:", (zoneResponse.payload?.errors || []).map(e => e.code));
              console.log("No rule changes were attempted.");
              process.exit(0);
            }
            zone = (zoneResponse.payload.result || []).find(candidate => candidate.name === "souviks.co.in") || null;
          }

          if (!zone) {
            console.log("Could not discover the souviks.co.in zone with the available token/zone ID.");
            for (const phase of ["http_request_firewall_custom", "http_request_firewall_managed", "http_request_sbfm"]) {
              const result = await api("/accounts/" + encodeURIComponent(accountId) + "/rulesets/phases/" + phase + "/entrypoint");
              console.log("Account-level " + phase + " access:", "HTTP", result.status, "API success:", result.ok);
              if (result.ok) {
                console.log("Account-level " + phase + " rules:", (result.payload.result.rules || []).map(rule => ({
                  id: rule.id, description: rule.description, action: rule.action, enabled: rule.enabled,
                })));
              } else {
                console.log("Account-level " + phase + " error codes:", (result.payload?.errors || []).map(e => e.code));
              }
            }
            console.log("No rule changes were attempted.");
            process.exit(0);
          }
          console.log("Zone:", { id: zone.id, name: zone.name, status: zone.status, plan: zone.plan?.name });

          const checks = [
            ["custom_firewall_rules", `/zones/${zone.id}/rulesets/phases/http_request_firewall_custom/entrypoint`],
            ["managed_firewall_rules", `/zones/${zone.id}/rulesets/phases/http_request_firewall_managed/entrypoint`],
            ["super_bot_fight_mode_rules", `/zones/${zone.id}/rulesets/phases/http_request_sbfm/entrypoint`],
            ["security_level", `/zones/${zone.id}/settings/security_level`],
            ["browser_check", `/zones/${zone.id}/settings/browser_check`],
            ["bot_fight_mode", `/zones/${zone.id}/settings/bot_fight_mode`],
          ];
          for (const [label, endpoint] of checks) {
            const result = await api(endpoint);
            console.log(label + ":", "HTTP", result.status, "API success:", result.ok);
            if (!result.ok) {
              console.log(label + " error codes:", (result.payload?.errors || []).map(e => e.code));
              continue;
            }
            const value = result.payload.result;
            if (label.endsWith("_rules")) {
              console.log(label + " rules:", (value.rules || []).map(rule => ({
                id: rule.id, description: rule.description, action: rule.action, enabled: rule.enabled,
                skipTargets: Object.keys(rule.action_parameters || {}),
              })));
            } else {
              console.log(label + " value:", value.value ?? value.id ?? "present");
            }
          }
          console.log("READ_ONLY_DIAGNOSTIC_COMPLETE: no WAF settings or rules were changed.");
          NODE
