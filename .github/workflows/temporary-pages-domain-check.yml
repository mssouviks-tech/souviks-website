name: Temporary Pages Domain Check

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-pages-domain:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: d88f7d40c65eb68eea794b8e6cee7379
      PROJECT: souviks-website
    steps:
      - name: Get Pages project and test pages.dev URLs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CF_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi

          project_json="$(curl -fsS --max-time 30             -H "Authorization: Bearer $CF_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT")"

          echo "=== PAGES PROJECT ==="
          echo "$project_json" | jq '{success, result: {name, subdomain, production_branch, source, deployment_configs}}' | sed 's/\r//g'

          subdomain="$(echo "$project_json" | jq -r '.result.subdomain')"
          if [[ -z "$subdomain" || "$subdomain" == "null" ]]; then
            echo "No pages.dev subdomain returned"
            exit 1
          fi

          base="https://$subdomain"
          urls=(
            "$base/en/products/12-x-15-nut"
            "$base/en/products/12-X-15-NUT"
            "$base/en/products/12%20X%2015%20Nut"
            "$base/en/products/12-x-15-nut/"
            "$base/en/products/12-x-15-nut.HTML"
            "$base/en/products/12-X-15-NUT.HTML"
            "$base/en/products/12%20X%2015%20Nut.HTML"
            "$base/en/products/"
            "$base/en/products"
            "$base/en/products/does-not-exist-xyz"
          )

          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -sIL --path-as-is --max-time 30 --connect-timeout 15 "$u" || true
            echo
          done
