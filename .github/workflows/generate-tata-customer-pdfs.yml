name: Generate Tata customer PDFs

on:
  push:
    branches:
      - docs/tata-customer-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install --upgrade pip reportlab pillow
      - name: Generate customer catalogue and price list
        run: python scripts/generate_tata_customer_pdfs.py
      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: souviks-tata-customer-pdfs
          path: dist/
          if-no-files-found: error
          retention-days: 7
