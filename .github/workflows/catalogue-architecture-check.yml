name: Catalogue Architecture Check

on:
  push:
    branches:
      - main
    paths:
      - "scripts/catalogue/**"
      - ".github/workflows/catalogue-architecture-check.yml"
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate static catalogue architecture
        run: python3 scripts/catalogue/validate.py
