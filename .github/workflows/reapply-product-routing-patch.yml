name: Validate Static Catalogue

on:
  workflow_run:
    workflows:
      - Reconcile Catalogue Projections
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: souviks-static-catalogue-validate
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce clean public URLs
        shell: python
        run: |
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          legacy = re.compile(
              r"/(?:account|login|register|forgot-password|reset-password|request-part|request-quote|thank-you|products|brands|categories|vehicles|about|contact|privacy-policy|terms|refund)\.html(?:[?#]|$)"
          )

          offenders = []
          for path in list(root.glob("**/*.html")) + list(root.glob("**/*.js")):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if legacy.search(text):
                  offenders.append(str(path))

          if offenders:
              print("Legacy .html public URLs found:")
              print("\n".join(offenders[:100]))
              sys.exit(1)

          print("Clean public URL invariant OK.")

      - name: Enforce static-only product routing
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "functions/products/[slug].js"
            "functions/en/products/[slug].js"
            "functions/bn/products/[slug].js"
            "functions/hi/products/[slug].js"
            "_routes.json"
          )

          changed=0
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Removing duplicate routing layer: $path"
              git rm -f --ignore-unmatch "$path"
              changed=1
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "Static-only product routing is already enforced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicate product routing layer"
          git push origin HEAD:main

      - name: Sync static product images and galleries
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(".")
          catalogue = json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8"))
          products = {
              str(item.get("id")): item
              for item in catalogue
              if item.get("active") is not False and item.get("id")
          }

          changed = []

          def image_url(product, filename):
              folder = str(product.get("image_folder") or product.get("id") or "").strip()
              name = str(filename or "").strip()
              if not folder or not name:
                  return ""
              return f"/assets/images/products/{folder}/{name}"

          # 1) Reconcile every static PDP with the canonical catalogue gallery.
          for lang in ("en", "hi", "bn"):
              for path in (root / lang / "products").glob("*.html"):
                  text = path.read_text(encoding="utf-8")

                  data_match = re.search(
                      r'window\.SOUVIKS_PRODUCT_PAGE_DATA\s*=\s*(\{.*?\});',
                      text,
                      re.S,
                  )
                  if not data_match:
                      continue

                  try:
                      embedded = json.loads(data_match.group(1))
                  except json.JSONDecodeError:
                      continue

                  product = products.get(str(embedded.get("id")))
                  gallery = product.get("gallery") if product else None
                  if not product or not isinstance(gallery, list) or not gallery:
                      continue

                  gallery = [str(name).strip() for name in gallery if str(name).strip()]
                  if not gallery:
                      continue

                  refreshed = dict(embedded)
                  refreshed["image_folder"] = product.get("image_folder") or embedded.get("image_folder") or product.get("id")
                  refreshed["image"] = gallery[0]
                  refreshed["primary_image"] = gallery[0]
                  refreshed["image_url"] = image_url(product, gallery[0])
                  refreshed["gallery"] = gallery
                  refreshed["gallery_dimensions"] = {
                      str(name): product.get("gallery_dimensions", {}).get(str(name))
                      for name in gallery
                      if isinstance(product.get("gallery_dimensions"), dict)
                      and isinstance(product.get("gallery_dimensions", {}).get(str(name)), list)
                      and len(product.get("gallery_dimensions", {}).get(str(name))) == 2
                  }

                  new_data = json.dumps(refreshed, ensure_ascii=False, separators=(",", ":"))
                  if new_data != data_match.group(1):
                      text = text[:data_match.start(1)] + new_data + text[data_match.end(1):]

                  main_src = image_url(product, gallery[0])
                  text, main_count = re.subn(
                      r'(<img\b[^>]*\bid="pdpMainImage"[^>]*\bsrc=")[^"]+(")',
                      lambda m: m.group(1) + main_src + m.group(2),
                      text,
                      count=1,
                  )

                  thumb_match = re.search(
                      r'(<div\s+class="pdp-thumbnails">).*?(</div><button\s+class="pdp-thumb-next")',
                      text,
                      re.S,
                  )
                  if thumb_match:
                      product_name = html.escape(str(refreshed.get("product_name") or refreshed.get("name") or "Product"), quote=True)
                      thumbs = []
                      for index, filename in enumerate(gallery, start=1):
                          src = image_url(product, filename)
                          thumbs.append(
                              f'<button class="pdp-thumb" type="button" aria-label="View {product_name} image {index}">'
                              f'<img src="{src}" alt="{product_name} image {index}" loading="lazy" decoding="async" draggable="false"></button>'
                          )
                      replacement = thumb_match.group(1) + "".join(thumbs) + thumb_match.group(2)
                      text = text[:thumb_match.start()] + replacement + text[thumb_match.end():]

                  if text != path.read_text(encoding="utf-8"):
                      path.write_text(text, encoding="utf-8")
                      changed.append(str(path))

          # 2) Reconcile product-card thumbnails everywhere the static builder emitted them.
          for path in root.glob("**/*.html"):
              if "/products/" in path.as_posix() and path.parent.name != "products":
                  # Entity pages can still contain product cards; do not skip them.
                  pass

              text = path.read_text(encoding="utf-8")
              original = text

              def refresh_card(match):
                  card = match.group(0)
                  id_match = re.search(
                      r'data-saved-product-id="([^"]+)"|data-id="([^"]+)"',
                      card,
                  )
                  if not id_match:
                      return card

                  product_id = id_match.group(1) or id_match.group(2)
                  product = products.get(str(product_id))
                  if not product:
                      return card

                  gallery = product.get("gallery")
                  if isinstance(gallery, list) and gallery:
                      gallery = [str(name).strip() for name in gallery if str(name).strip()]
                  else:
                      gallery = []

                  src = image_url(product, gallery[0]) if gallery else str(product.get("image_url") or "").strip()
                  if not src:
                      return card

                  return re.sub(
                      r'(<img\b[^>]*class="product-image-file"[^>]*\bsrc=")[^"]+(")',
                      lambda m: m.group(1) + src + m.group(2),
                      card,
                      count=1,
                  )

              text = re.sub(
                  r'<article\s+class="product-card".*?</article>',
                  refresh_card,
                  text,
                  flags=re.S,
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  if str(path) not in changed:
                      changed.append(str(path))

          if not changed:
              print("Static product image markup is already synchronized.")
          else:
              print(f"Synchronized static product images in {len(changed)} HTML files.")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "en", "hi", "bn"], check=True)
              subprocess.run(["git", "commit", "-m", "Sync static product image markup"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

      - name: Normalize blank part-number presentation
        shell: python
        run: |
          import pathlib
          changed = []
          for lang in ("en", "hi", "bn"):
              root = pathlib.Path(lang) / "products"
              if not root.exists():
                  continue
              for path in root.glob("*.html"):
                  text = path.read_text(encoding="utf-8")
                  original = text
                  text = text.replace("Part Number: .", "Part Number: available on request.")
                  text = text.replace(
                      "<strong>Part Number</strong><span></span>",
                      "<strong>Part Number</strong><span>Available on request</span>"
                  )
                  if text != original:
                      path.write_text(text, encoding="utf-8")
                      changed.append(str(path))
          if not changed:
              print("No blank part-number presentation fixes required.")
          else:
              print(f"Normalized {len(changed)} product pages.")

              import subprocess
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "en/products", "hi/products", "bn/products"], check=True)
              subprocess.run(["git", "commit", "-m", "Normalize blank part-number presentation"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

      - name: Ensure product JSON-LD and canonical markup
        shell: python
        run: |
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(".")
          catalogue = {
              str(item.get("id")): item
              for item in json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8"))
              if item.get("active") is not False and item.get("id")
          }
          changed = []

          def canonical_url(lang, slug):
              return f"https://www.souviks.co.in/{lang}/products/{slug}"

          def image_urls(product):
              folder = str(product.get("image_folder") or product.get("id") or "").strip()
              gallery = product.get("gallery")
              if folder and isinstance(gallery, list) and gallery:
                  return [
                      f"https://www.souviks.co.in/assets/images/products/{folder}/{str(name).strip()}"
                      for name in gallery if str(name).strip()
                  ]
              image = str(product.get("image_url") or "").strip()
              return [f"https://www.souviks.co.in{image}"] if image and image.startswith("/") else []

          for lang in ("en", "hi", "bn"):
              for path in (root / lang / "products").glob("*.html"):
                  html = path.read_text(encoding="utf-8")
                  data_match = re.search(
                      r'window\.SOUVIKS_PRODUCT_PAGE_DATA\s*=\s*(\{.*?\});',
                      html,
                      re.S,
                  )
                  if not data_match:
                      continue
                  try:
                      embedded = json.loads(data_match.group(1))
                  except json.JSONDecodeError:
                      continue

                  product = catalogue.get(str(embedded.get("id")), embedded)
                  slug = str(product.get("slug") or embedded.get("slug") or path.stem)
                  url = canonical_url(lang, slug)

                  jsonld_blocks = re.findall(
                      r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                      html,
                      flags=re.I | re.S,
                  )
                  types = set()
                  for block in jsonld_blocks:
                      try:
                          obj = json.loads(block.strip())
                      except json.JSONDecodeError:
                          continue
                      graph = obj.get("@graph") if isinstance(obj, dict) else None
                      nodes = graph if isinstance(graph, list) else [obj]
                      for node in nodes:
                          node_type = node.get("@type") if isinstance(node, dict) else None
                          if isinstance(node_type, list):
                              types.update(str(v) for v in node_type)
                          elif node_type:
                              types.add(str(node_type))

                  original = html

                  # Keep image-related metadata synchronized with the canonical catalogue.
                  gallery_urls = image_urls(product)
                  primary_image_url = gallery_urls[0] if gallery_urls else ""
                  if primary_image_url:
                      html = re.sub(
                          r'(<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\'])[^"\']*(["\'])',
                          lambda m: m.group(1) + primary_image_url + m.group(2),
                          html,
                          count=1,
                          flags=re.I,
                      )
                      image_alt = html.escape(
                          str(product.get("product_name") or product.get("name") or "Product image"),
                          quote=True,
                      )
                      html = re.sub(
                          r'(<meta\b[^>]*property=["\']og:image:alt["\'][^>]*content=["\'])[^"\']*(["\'])',
                          lambda m: m.group(1) + image_alt + m.group(2),
                          html,
                          count=1,
                          flags=re.I,
                      )
                      html = re.sub(
                          r'(<meta\b[^>]*name=["\']twitter:image["\'][^>]*content=["\'])[^"\']*(["\'])',
                          lambda m: m.group(1) + primary_image_url + m.group(2),
                          html,
                          count=1,
                          flags=re.I,
                      )
                      html = re.sub(
                          r'(<meta\b[^>]*name=["\']twitter:image:alt["\'][^>]*content=["\'])[^"\']*(["\'])',
                          lambda m: m.group(1) + image_alt + m.group(2),
                          html,
                          count=1,
                          flags=re.I,
                      )
                      html = re.sub(
                          r'(<link\b[^>]*rel=["\']preload["\'][^>]*as=["\']image["\'][^>]*href=["\'])[^"\']*(["\'])',
                          lambda m: m.group(1) + primary_image_url.replace("https://www.souviks.co.in", "") + m.group(2),
                          html,
                          count=1,
                          flags=re.I,
                      )

                  # Canonical and social URLs must match the generated language-specific PDP URL.
                  html = re.sub(
                      r'(<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\'])[^"\']*(["\'])',
                      lambda m: m.group(1) + url + m.group(2),
                      html,
                      count=1,
                      flags=re.I,
                  )
                  html = re.sub(
                      r'(<meta\b[^>]*property=["\']og:url["\'][^>]*content=["\'])[^"\']*(["\'])',
                      lambda m: m.group(1) + url + m.group(2),
                      html,
                      count=1,
                      flags=re.I,
                  )
                  html = re.sub(
                      r'(<meta\b[^>]*name=["\']twitter:url["\'][^>]*content=["\'])[^"\']*(["\'])',
                      lambda m: m.group(1) + url + m.group(2),
                      html,
                      count=1,
                      flags=re.I,
                  )

                  if "Product" not in types:
                      name = str(product.get("product_name") or product.get("name") or "")
                      description = str(product.get("description") or "").strip()
                      images = image_urls(product)

                      identifiers = []
                      for value in (
                          product.get("part_number"),
                          product.get("manufacturer_part_number"),
                          *(product.get("manufacturer_part_numbers") or []),
                      ):
                          value = str(value or "").strip()
                          if value and not any(item["value"] == value for item in identifiers):
                              identifiers.append({"propertyID": "part_number", "value": value})

                      product_schema = {
                          "@context": "https://schema.org",
                          "@type": "Product",
                          "@id": url + "#product",
                          "name": name,
                          "url": url,
                          "mainEntityOfPage": url,
                          "description": description,
                          "image": images,
                          "sku": str(product.get("id") or ""),
                          "brand": {
                              "@type": "Brand",
                              "name": str(product.get("brand_name") or product.get("brand") or ""),
                          },
                          "category": str(product.get("category_name") or product.get("category") or ""),
                      }

                      mpn = str(product.get("manufacturer_part_number") or "").strip()
                      if not mpn:
                          mpn = str(product.get("part_number") or "").strip()
                      if mpn:
                          product_schema["mpn"] = mpn
                      if identifiers:
                          product_schema["identifier"] = identifiers

                      selling_price = product.get("selling_price")
                      try:
                          numeric_price = float(selling_price)
                      except (TypeError, ValueError):
                          numeric_price = None
                      if numeric_price is not None and numeric_price > 0:
                          product_schema["offers"] = {
                              "@type": "Offer",
                              "url": url,
                              "priceCurrency": "INR",
                              "price": numeric_price,
                              "seller": {
                                  "@type": "Organization",
                                  "name": "Souviks",
                              },
                          }

                      schema_html = (
                          '    <script type="application/ld+json">\n'
                          + json.dumps(product_schema, ensure_ascii=False, indent=2)
                          + '\n    </script>\n\n'
                      )

                      first_ld = re.search(
                          r'\s*<script\b[^>]*type=["\']application/ld\+json["\']',
                          html,
                          flags=re.I,
                      )
                      if first_ld:
                          html = html[:first_ld.start()] + "\n" + schema_html + html[first_ld.start():]
                      else:
                          head_close = re.search(r'</head>', html, flags=re.I)
                          if head_close:
                              html = html[:head_close.start()] + "\n" + schema_html + html[head_close.start():]

                  # Repair an existing Product node as well as creating a missing one.
                  repaired_blocks = []
                  for match in re.finditer(
                      r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                      html,
                      flags=re.I | re.S,
                  ):
                      block = match.group(1)
                      try:
                          obj = json.loads(block.strip())
                      except json.JSONDecodeError:
                          continue

                      graph = obj.get("@graph") if isinstance(obj, dict) else None
                      nodes = graph if isinstance(graph, list) else [obj]
                      updated = False

                      for node in nodes:
                          if not isinstance(node, dict) or node.get("@type") != "Product":
                              continue

                          node["name"] = str(product.get("product_name") or product.get("name") or node.get("name") or "")
                          node["url"] = url
                          node["mainEntityOfPage"] = url
                          node["description"] = str(product.get("description") or node.get("description") or "")
                          if gallery_urls:
                              node["image"] = gallery_urls
                          node["sku"] = str(product.get("id") or node.get("sku") or "")

                          brand_name = str(product.get("brand_name") or product.get("brand") or "").strip()
                          if brand_name:
                              node["brand"] = {"@type": "Brand", "name": brand_name}

                          category_name = str(product.get("category_name") or product.get("category") or "").strip()
                          if category_name:
                              node["category"] = category_name

                          offers = node.get("offers") if isinstance(node.get("offers"), dict) else {}
                          offers["@type"] = "Offer"
                          offers["url"] = url
                          offers["priceCurrency"] = "INR"
                          try:
                              numeric_price = float(product.get("selling_price"))
                          except (TypeError, ValueError):
                              numeric_price = None
                          if numeric_price is not None and numeric_price > 0:
                              offers["price"] = numeric_price
                          node["offers"] = offers
                          updated = True

                      if updated:
                          replacement = '<script type="application/ld+json">\n' + json.dumps(obj, ensure_ascii=False, indent=2) + '\n</script>'
                          repaired_blocks.append((match.start(), match.end(), replacement))

                  for start, end, replacement in reversed(repaired_blocks):
                      html = html[:start] + replacement + html[end:]

                  # Ensure every product PDP has a valid BreadcrumbList.
                  jsonld_blocks_after = re.findall(
                      r'<script\\b[^>]*type=["\\']application/ld\\+json["\\'][^>]*>(.*?)</script>',
                      html,
                      flags=re.I | re.S,
                  )
                  has_breadcrumb = False
                  for block in jsonld_blocks_after:
                      try:
                          obj = json.loads(block.strip())
                      except json.JSONDecodeError:
                          continue
                      graph = obj.get("@graph") if isinstance(obj, dict) else None
                      nodes = graph if isinstance(graph, list) else [obj]
                      for node in nodes:
                          if isinstance(node, dict) and node.get("@type") == "BreadcrumbList":
                              has_breadcrumb = True
                              break
                      if has_breadcrumb:
                          break

                  if not has_breadcrumb:
                      breadcrumb = {
                          "@context": "https://schema.org",
                          "@type": "BreadcrumbList",
                          "itemListElement": [
                              {
                                  "@type": "ListItem",
                                  "position": 1,
                                  "name": "Home",
                                  "item": f"https://www.souviks.co.in/{lang}/",
                              },
                              {
                                  "@type": "ListItem",
                                  "position": 2,
                                  "name": str(product.get("category_name") or product.get("category") or "Products"),
                                  "item": f"https://www.souviks.co.in/{lang}/categories/{text(product.get('category_id'))}",
                              },
                              {
                                  "@type": "ListItem",
                                  "position": 3,
                                  "name": name,
                                  "item": url,
                              },
                          ],
                      }
                      breadcrumb_html = (
                          '    <script type="application/ld+json">\\n'
                          + json.dumps(breadcrumb, ensure_ascii=False, indent=2)
                          + '\\n    </script>\\n\\n'
                      )
                      head_close = re.search(r'</head>', html, flags=re.I)
                      if head_close:
                          html = html[:head_close.start()] + breadcrumb_html + html[head_close.start():]

                  if html != original:
                      path.write_text(html, encoding="utf-8")
                      changed.append(str(path))

          if not changed:
              print("Product JSON-LD and BreadcrumbList are already complete.")
          else:
              print(f"Repaired Product JSON-LD in {len(changed)} pages.")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "en/products", "hi/products", "bn/products"], check=True)
              subprocess.run(["git", "commit", "-m", "Repair product JSON-LD"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

      - name: Validate catalogue integrity and generated pages
        shell: python
        run: |
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          catalogue = json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8"))
          brands = json.loads((root / "assets/data/brands.json").read_text(encoding="utf-8"))
          categories = json.loads((root / "assets/data/categories.json").read_text(encoding="utf-8"))
          vehicles = json.loads((root / "assets/data/vehicles.json").read_text(encoding="utf-8"))

          errors = []

          def unique(field, rows, label):
              values = [r.get(field) for r in rows]
              if len(values) != len(set(values)):
                  errors.append(f"Duplicate {field} in {label}")

          unique("id", catalogue, "catalogue")
          unique("slug", catalogue, "catalogue")
          unique("slug", brands, "brands")
          unique("slug", categories, "categories")
          unique("slug", vehicles, "vehicles")

          active_products = [p for p in catalogue if p.get("active") is not False]
          active_brands = [b for b in brands if b.get("active") is not False]
          active_categories = [c for c in categories if c.get("active") is not False]
          active_vehicles = [v for v in vehicles if v.get("active") is not False]

          for p in active_products:
              if not p.get("id") or not p.get("slug") or not p.get("name"):
                  errors.append(f"Product missing identity: {p.get('id')}")
              if not p.get("brand_id"):
                  errors.append(f"Product missing brand: {p.get('id')}")
              if not p.get("category_id"):
                  errors.append(f"Product missing category: {p.get('id')}")
              if not p.get("image_url"):
                  errors.append(f"Product missing image URL: {p.get('id')}")

          expected = {
              "products": len(active_products),
              "brands": len(active_brands),
              "categories": len(active_categories),
              "vehicles": len(active_vehicles),
          }

          # Every public language must carry the same catalogue counters.
          for lang in ("en", "hi", "bn"):
              page = root / lang / "index.html"
              text = page.read_text(encoding="utf-8")
              for key, value in expected.items():
                  if str(value) not in text:
                      errors.append(f"{lang}/index.html does not contain current {key} count {value}")

          # About pages must not drift from the catalogue.
          for lang in ("en", "hi", "bn"):
              page = root / lang / "about.html"
              if page.exists():
                  text = page.read_text(encoding="utf-8")
                  if str(expected["products"]) not in text or str(expected["brands"]) not in text:
                      errors.append(f"{lang}/about.html has stale catalogue counters")

          # No temporary build artefacts are allowed in production assets.
          forbidden = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              name = p.name.lower()
              if name.startswith(".souviks_temp_") or name.endswith(".bak") or name.endswith(".old") or name == "txt.txt":
                  forbidden.append(str(p))
          if forbidden:
              errors.append("Temporary production files remain: " + ", ".join(forbidden))

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Catalogue integrity OK")
          print(json.dumps(expected, indent=2))

      - name: Verify generated page parity and SEO invariants
        shell: python
        run: |
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          products = [p for p in json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8")) if p.get("active") is not False]
          brands = [b for b in json.loads((root / "assets/data/brands.json").read_text(encoding="utf-8")) if b.get("active") is not False]
          categories = [c for c in json.loads((root / "assets/data/categories.json").read_text(encoding="utf-8")) if c.get("active") is not False]
          vehicles = [v for v in json.loads((root / "assets/data/vehicles.json").read_text(encoding="utf-8")) if v.get("active") is not False]

          errors = []
          missing = {"products": [], "brands": [], "categories": [], "vehicles": []}
          orphan = {"products": [], "brands": [], "categories": [], "vehicles": []}

          def check_directory(kind, entries, pattern):
              expected = {root / pattern.format(lang=lang, slug=item["slug"]) for lang in ("en", "hi", "bn") for item in entries}
              actual = set(root.glob(pattern.format(lang="*", slug="*")))
              # pathlib does not expand nested * as a shell glob, so enumerate explicitly.
              actual = set()
              for lang in ("en", "hi", "bn"):
                  actual.update((root / pattern.format(lang=lang, slug="*")).parent.glob("*.html"))
              missing[kind] = sorted(str(p) for p in expected - actual)
              orphan[kind] = sorted(str(p) for p in actual - expected)

          check_directory("products", products, "{lang}/products/{slug}.html")
          check_directory("brands", brands, "{lang}/brands/{slug}.html")
          check_directory("categories", categories, "{lang}/categories/{slug}.html")
          check_directory("vehicles", vehicles, "{lang}/vehicles/{slug}.html")

          for kind in missing:
              if missing[kind]:
                  errors.append(f"Missing generated {kind} pages: " + ", ".join(missing[kind][:20]))

          # Orphan checks are strict for generated entity directories.
          for kind in orphan:
              if orphan[kind]:
                  errors.append(f"Orphan generated {kind} pages: " + ", ".join(orphan[kind][:20]))

          # Every generated product page must carry the canonical URL, Product schema,
          # and BreadcrumbList, and must not expose broken blank part-number text.
          for lang in ("en", "hi", "bn"):
              for product in products:
                  path = root / lang / "products" / f"{product['slug']}.html"
                  if not path.exists():
                      continue
                  html = path.read_text(encoding="utf-8")
                  expected_url = f"https://www.souviks.co.in/{lang}/products/{product['slug']}"
                  canonical_match = re.search(
                      r'<link\b[^>]*\brel=["\']canonical["\'][^>]*\bhref=["\']([^"\']+)',
                      html,
                      flags=re.I | re.S,
                  )
                  if not canonical_match or canonical_match.group(1).strip() != expected_url:
                      errors.append(f"Bad/missing canonical: {path}")

                  jsonld_blocks = re.findall(
                      r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                      html,
                      flags=re.I | re.S,
                  )
                  jsonld_types = set()
                  for block in jsonld_blocks:
                      try:
                          obj = json.loads(block.strip())
                      except json.JSONDecodeError:
                          continue
                      graph = obj.get("@graph") if isinstance(obj, dict) else None
                      nodes = graph if isinstance(graph, list) else [obj]
                      for node in nodes:
                          node_type = node.get("@type") if isinstance(node, dict) else None
                          if isinstance(node_type, list):
                              jsonld_types.update(str(v) for v in node_type)
                          elif node_type:
                              jsonld_types.add(str(node_type))

                  if "Product" not in jsonld_types:
                      errors.append(f"Missing Product schema: {path}")
                  if "BreadcrumbList" not in jsonld_types:
                      errors.append(f"Missing BreadcrumbList: {path}")
                  if "Part Number: ." in html:
                      errors.append(f"Broken blank part-number SEO text: {path}")

                  title_match = re.search(r"<title>(.*?)</title>", html, flags=re.I | re.S)
                  if not title_match:
                      errors.append(f"Missing title: {path}")
                  else:
                      title_value = re.sub(r"<[^>]+>", "", title_match.group(1)).strip()
                      if len(title_value) > 70:
                          errors.append(f"Product title too long ({len(title_value)} chars): {path}")
                      if title_value.count(" | Souviks") > 1:
                          errors.append(f"Duplicated product title suffix: {path}")
                      product_name = str(product.get("product_name") or product.get("name") or "").strip()
                      if product_name and title_value.count(product_name) > 1:
                          errors.append(f"Duplicated product name in title: {path}")

                  description_match = re.search(
                      r'<meta\b[^>]*name=["\']description["\'][^>]*content=["\']([^"\']*)',
                      html,
                      flags=re.I | re.S,
                  )
                  if not description_match:
                      errors.append(f"Missing meta description: {path}")
                  else:
                      description_value = description_match.group(1).strip()
                      if not 70 <= len(description_value) <= 170:
                          errors.append(
                              f"Product meta description length {len(description_value)} outside 70-170: {path}"
                          )

                  if re.search(r"<strong>\s*Part Number\s*</strong>\s*<span>\s*</span>", html, re.I):
                      errors.append(f"Blank part-number detail row: {path}")

          page_schema_expectations = [
              ("brands", "CollectionPage"),
              ("categories", "CollectionPage"),
              ("vehicles", "CollectionPage"),
              ("products", "CollectionPage"),
              ("about", "AboutPage"),
              ("contact", "ContactPage"),
          ]
          for lang in ("en", "hi", "bn"):
              for page_name, schema_type in page_schema_expectations:
                  path = root / lang / f"{page_name}.html"
                  if not path.exists():
                      errors.append(f"Missing landing page: {path}")
                      continue
                  html = path.read_text(encoding="utf-8")
                  if f'"@type": "{schema_type}"' not in html:
                      errors.append(f"Missing {schema_type} schema: {path}")
                  if '"@type": "BreadcrumbList"' not in html:
                      errors.append(f"Missing BreadcrumbList: {path}")

          # Report known data-quality gaps without blocking the deployment.
          missing_parts = sum(not str(p.get("part_number") or p.get("partNumber") or "").strip() for p in products)
          missing_prices = sum(p.get("selling_price") is None for p in products)
          missing_mrps = sum(p.get("mrp") is None for p in products)
          placeholder_images = sum("/assets/images/placeholder.webp" in str(p.get("image_url") or "") for p in products)
          print(f"Data-quality report: {missing_parts} products missing part numbers; {missing_prices} missing selling prices; {missing_mrps} missing MRPs; {placeholder_images} using placeholder images.")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Generated page parity and SEO invariants OK")

      - name: Verify catalogue image-folder parity
        shell: python
        run: |
          import json
          import pathlib
          import sys

          root = pathlib.Path(".")
          catalogue = [p for p in json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8")) if p.get("active") is not False]
          by_id = {str(p.get("id")): p for p in catalogue if p.get("id")}

          errors = []
          folders = set()

          image_root = root / "assets/images/products"
          if image_root.exists():
              for folder in image_root.iterdir():
                  if not folder.is_dir():
                      continue
                  files = sorted(
                      p.name for p in folder.iterdir()
                      if p.is_file() and p.suffix.lower() in {".webp", ".jpg", ".jpeg", ".png"}
                  )
                  if not files:
                      continue

                  folders.add(folder.name)
                  product = by_id.get(folder.name)
                  if product is None:
                      continue

                  image_url = str(product.get("image_url") or "").strip()
                  if image_url.endswith("/placeholder.webp"):
                      errors.append(f"Product {folder.name} has image files but catalogue still uses placeholder")

                  gallery = product.get("gallery")
                  if isinstance(gallery, list) and gallery:
                      missing_gallery = [name for name in gallery if not (folder / str(name)).exists()]
                      if missing_gallery:
                          errors.append(f"Product {folder.name} gallery references missing files: {', '.join(missing_gallery)}")

          for product in catalogue:
              pid = str(product.get("id") or "").strip()
              gallery = product.get("gallery")
              if not pid or not isinstance(gallery, list) or not gallery:
                  continue

              names = [str(name).strip() for name in gallery if str(name).strip()]
              if not names:
                  errors.append(f"Product {pid} has an empty gallery declaration.")
                  continue

              if len(names) > 4:
                  errors.append(f"Product {pid} has {len(names)} gallery views; maximum is 4.")
              if len(names) != len(set(names)):
                  errors.append(f"Product {pid} has duplicate gallery filenames.")

              expected_names = [f"{i}.webp" for i in range(1, len(names) + 1)]
              if names != expected_names:
                  errors.append(
                      f"Product {pid} gallery filenames are not sequential 1.webp..N.webp: {names}"
                  )

              image_url = str(product.get("image_url") or "").strip()
              if image_url.endswith("/placeholder.webp"):
                  errors.append(f"Product {pid} has a real gallery but still references the placeholder image.")

              if image_url and names:
                  expected_image_url = f"/assets/images/products/{str(product.get('image_folder') or pid).strip()}/{names[0]}"
                  if image_url != expected_image_url:
                      errors.append(
                          f"Product {pid} image_url does not point to gallery[0]: {image_url}"
                      )

              if str(product.get("image") or "").strip() != names[0]:
                  errors.append(f"Product {pid} primary image does not match gallery[0].")
              if str(product.get("primary_image") or "").strip() != names[0]:
                  errors.append(f"Product {pid} primary_image does not match gallery[0].")

              dimensions = product.get("gallery_dimensions")
              if isinstance(dimensions, dict):
                  stale = [name for name in dimensions if name not in names]
                  if stale:
                      errors.append(
                          f"Product {pid} has stale gallery dimensions: " + ", ".join(map(str, stale))
                      )

          missing_folders = [p["id"] for p in catalogue if p["id"] not in folders and not str(p.get("image_url") or "").endswith("/placeholder.webp")]
          if missing_folders:
              errors.append("Catalogue references missing image folders: " + ", ".join(missing_folders[:40]))

          image_products = sum(p["id"] in folders for p in catalogue)
          placeholder_products = sum(str(p.get("image_url") or "").endswith("/placeholder.webp") for p in catalogue)
          print(f"Image-folder coverage: {image_products}/{len(catalogue)} products; {placeholder_products} placeholder references.")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Catalogue image-folder parity OK")

      - name: Verify origin robots policy
        shell: python
        run: |
          import pathlib
          import re
          import sys

          robots_path = pathlib.Path("robots.txt")
          if not robots_path.exists():
              print("robots.txt is missing.")
              sys.exit(1)

          text = robots_path.read_text(encoding="utf-8", errors="ignore")
          compact = re.sub(r"\s+", " ", text).lower()

          required = [
              "user-agent: *",
              "allow: /",
              "disallow: /assets/temp/",
              "disallow: /drafts/",
              "sitemap: https://www.souviks.co.in/sitemap.xml",
          ]
          errors = [item for item in required if item.lower() not in compact]

          wildcard_match = re.search(
              r"user-agent:\s*\*([\s\S]*?)(?=\n\s*user-agent:|\Z)",
              text,
              flags=re.I,
          )
          if wildcard_match and re.search(r"disallow:\s*/\s*$", wildcard_match.group(1), flags=re.I | re.M):
              errors.append("Wildcard robots policy blocks the entire site.")

          for blocked in ("/en/", "/hi/", "/bn/", "/sitemap.xml", "/sitemaps/"):
              if re.search(rf"disallow:\s*{re.escape(blocked)}\s*$", text, flags=re.I | re.M):
                  errors.append(f"robots.txt blocks required public path: {blocked}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Origin robots policy invariant OK.")

      - name: Verify sitemap structure, targets, canonical and indexation
        shell: python
        run: |
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          base = "https://www.souviks.co.in"
          sitemap_index = root / "sitemap.xml"
          expected_children = {
              "/sitemaps/pages.xml",
              "/sitemaps/products.xml",
              "/sitemaps/brands.xml",
              "/sitemaps/categories.xml",
              "/sitemaps/vehicles.xml",
          }

          errors = []

          def parse_sitemap(path):
              try:
                  tree = ET.parse(path)
              except Exception as exc:
                  errors.append(f"Invalid XML: {path}: {exc}")
                  return []
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              return [node.text.strip() for node in tree.findall(".//sm:loc", ns) if node.text and node.text.strip()]

          index_locs = set(parse_sitemap(sitemap_index))
          if index_locs != {base + p for p in expected_children}:
              errors.append(f"Sitemap index mismatch: {sorted(index_locs)}")

          sitemap_files = [root / p.lstrip("/") for p in expected_children]
          all_urls = []

          for path in sitemap_files:
              locs = parse_sitemap(path)
              if len(locs) != len(set(locs)):
                  errors.append(f"Duplicate URLs in {path}")
              all_urls.extend(locs)

          if len(all_urls) != len(set(all_urls)):
              errors.append("Duplicate URL present across child sitemaps.")

          for url in all_urls:
              m = re.match(r"https://www\.souviks\.co\.in/(en|hi|bn)(/.*)?$", url)
              if not m:
                  errors.append(f"Unexpected sitemap URL: {url}")
                  continue

              lang = m.group(1)
              route = m.group(2) or "/"
              if ".html" in route:
                  errors.append(f"Legacy .html URL in sitemap: {url}")

              if route == "/":
                  file_path = root / lang / "index.html"
              else:
                  file_path = root / lang / (route.lstrip("/") + ".html")

              if not file_path.exists():
                  errors.append(f"Sitemap target has no generated page: {url} -> {file_path}")
                  continue

              html = file_path.read_text(encoding="utf-8", errors="ignore")
              robots = re.search(
                  r'<meta\b[^>]*name=["\\\']robots["\\\'][^>]*content=["\\\']([^"\\\']+)',
                  html,
                  flags=re.I,
              )
              if robots and "noindex" in robots.group(1).lower():
                  errors.append(f"Sitemap contains noindex page: {url}")

              canonical = re.search(
                  r'<link\b[^>]*rel=["\\\']canonical["\\\'][^>]*href=["\\\']([^"\\\']+)',
                  html,
                  flags=re.I,
              )
              expected_canonical = url.rstrip("/") if route != "/" else url
              if not canonical:
                  errors.append(f"Sitemap target missing canonical: {url}")
              elif canonical.group(1).strip().rstrip("/") != expected_canonical.rstrip("/"):
                  errors.append(
                      f"Sitemap target canonical mismatch: {url} -> {canonical.group(1).strip()}"
                  )

          print(f"Validated {len(all_urls)} sitemap URLs against generated HTML.")
          if errors:
              print("\n".join(errors[:200]))
              sys.exit(1)

          print("Sitemap structure, target, canonical and indexation invariants OK.")

