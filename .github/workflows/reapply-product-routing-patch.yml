name: Enforce Static Product Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1



      - name: Direct HTTP edge-case check
        shell: bash
        run: |
          set -u
          urls=(
            "https://www.souviks.co.in/en/products/12-x-15-nut"
            "https://www.souviks.co.in/en/products/12-X-15-NUT"
            "https://www.souviks.co.in/en/products/12%20X%2015%20Nut"
            "https://www.souviks.co.in/en/products/12-x-15-nut/"
            "https://www.souviks.co.in/en/products/12-x-15-nut.HTML"
            "https://www.souviks.co.in/en/products/12-X-15-NUT.HTML"
            "https://www.souviks.co.in/en/products/12%20X%2015%20Nut.HTML"
            "https://www.souviks.co.in/en/products/"
            "https://www.souviks.co.in/en/products"
            "https://www.souviks.co.in/en/products/does-not-exist-xyz"
          )

          resolve() {
            python3 - "$1" "$2" <<'PY'
from urllib.parse import urljoin
import sys
print(urljoin(sys.argv[1], sys.argv[2]))
PY
          }

          for original_url in "${urls[@]}"; do
            echo
            echo "=== TEST: $original_url ==="
            current="$original_url"
            for hop in {0..9}; do
              headers="$(mktemp)"
              if ! curl -sS --path-as-is --max-time 30 --connect-timeout 15 -D "$headers" -o /dev/null "$current"; then
                echo "REQUEST_ERROR url=$current"
                rm -f "$headers"
                break
              fi
              status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code+0 }' "$headers")"
              location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ { sub(/^Location:[[:space:]]*/, ""); print }' "$headers" | tail -1)"
              printf 'HOP %s: status=%s url=%s' "$hop" "$status" "$current"
              [[ -n "$location" ]] && printf ' location=%s' "$location"
              printf '\n'
              rm -f "$headers"
              if [[ "$status" =~ ^3[0-9][0-9]$ && -n "$location" ]]; then
                next="$(resolve "$current" "$location")"
                [[ "$next" == "$current" ]] && { echo "REDIRECT_LOOP"; break; }
                current="$next"
              else
                break
              fi
            done
          done

      - name: Verify canonical static-only branch
        run: git fetch origin fix/product-routing-static-only --depth=1

      - name: Remove duplicate product routing layer
        run: |
          git rm -f --ignore-unmatch \
            "functions/products/[slug].js" \
            "functions/en/products/[slug].js" \
            "functions/bn/products/[slug].js" \
            "functions/hi/products/[slug].js" \
            "_routes.json"

      - name: Commit cleanup if required
        run: |
          if git diff --quiet HEAD -- \
            "functions/products/[slug].js" \
            "functions/en/products/[slug].js" \
            "functions/bn/products/[slug].js" \
            "functions/hi/products/[slug].js" \
            "_routes.json"; then
            echo "Static-only product routing is already present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Remove duplicate product routing layer"
          git push origin HEAD:main
