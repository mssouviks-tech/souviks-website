name: Validate Static Catalogue

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
      - name: Enforce static-only product routing
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "functions/products/[slug].js"
            "functions/en/products/[slug].js"
            "functions/bn/products/[slug].js"
            "functions/hi/products/[slug].js"
            "_routes.json"
          )

          changed=0
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Removing duplicate routing layer: $path"
              git rm -f --ignore-unmatch "$path"
              changed=1
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "Static-only product routing is already enforced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicate product routing layer"
          git push origin HEAD:main


        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize blank part-number presentation
        shell: python
        run: |
          import pathlib
          changed = []
          for lang in ("en", "hi", "bn"):
              root = pathlib.Path(lang) / "products"
              if not root.exists():
                  continue
              for path in root.glob("*.html"):
                  text = path.read_text(encoding="utf-8")
                  original = text
                  text = text.replace("Part Number: .", "Part Number: available on request.")
                  text = text.replace(
                      "<strong>Part Number</strong><span></span>",
                      "<strong>Part Number</strong><span>Available on request</span>"
                  )
                  if text != original:
                      path.write_text(text, encoding="utf-8")
                      changed.append(str(path))
          if not changed:
              print("No blank part-number presentation fixes required.")
          else:
              print(f"Normalized {len(changed)} product pages.")

              import subprocess
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "en/products", "hi/products", "bn/products"], check=True)
              subprocess.run(["git", "commit", "-m", "Normalize blank part-number presentation"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

      - name: Validate catalogue integrity and generated pages
        shell: python
        run: |
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          catalogue = json.loads((root / "assets/data/catalogue-index.json").read_text(encoding="utf-8"))
          brands = json.loads((root / "assets/data/brands.json").read_text(encoding="utf-8"))
          categories = json.loads((root / "assets/data/categories.json").read_text(encoding="utf-8"))
          vehicles = json.loads((root / "assets/data/vehicles.json").read_text(encoding="utf-8"))

          errors = []

          def unique(field, rows, label):
              values = [r.get(field) for r in rows]
              if len(values) != len(set(values)):
                  errors.append(f"Duplicate {field} in {label}")

          unique("id", catalogue, "catalogue")
          unique("slug", catalogue, "catalogue")
          unique("slug", brands, "brands")
          unique("slug", categories, "categories")
          unique("slug", vehicles, "vehicles")

          active_products = [p for p in catalogue if p.get("active") is not False]
          active_brands = [b for b in brands if b.get("active") is not False]
          active_categories = [c for c in categories if c.get("active") is not False]
          active_vehicles = [v for v in vehicles if v.get("active") is not False]

          for p in active_products:
              if not p.get("id") or not p.get("slug") or not p.get("name"):
                  errors.append(f"Product missing identity: {p.get('id')}")
              if not p.get("brand_id"):
                  errors.append(f"Product missing brand: {p.get('id')}")
              if not p.get("category_id"):
                  errors.append(f"Product missing category: {p.get('id')}")
              if not p.get("image_url"):
                  errors.append(f"Product missing image URL: {p.get('id')}")

          expected = {
              "products": len(active_products),
              "brands": len(active_brands),
              "categories": len(active_categories),
              "vehicles": len(active_vehicles),
          }

          # Every public language must carry the same catalogue counters.
          for lang in ("en", "hi", "bn"):
              page = root / lang / "index.html"
              text = page.read_text(encoding="utf-8")
              for key, value in expected.items():
                  if str(value) not in text:
                      errors.append(f"{lang}/index.html does not contain current {key} count {value}")

          # About pages must not drift from the catalogue.
          for lang in ("en", "hi", "bn"):
              page = root / lang / "about.html"
              if page.exists():
                  text = page.read_text(encoding="utf-8")
                  if str(expected["products"]) not in text or str(expected["brands"]) not in text:
                      errors.append(f"{lang}/about.html has stale catalogue counters")

          # No temporary build artefacts are allowed in production assets.
          forbidden = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              name = p.name.lower()
              if name.startswith(".souviks_temp_") or name.endswith(".bak") or name.endswith(".old") or name == "txt.txt":
                  forbidden.append(str(p))
          if forbidden:
              errors.append("Temporary production files remain: " + ", ".join(forbidden))

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Catalogue integrity OK")
          print(json.dumps(expected, indent=2))

      - name: Verify sitemap counts
        shell: python
        run: |
          import pathlib, re, sys
          catalogue = __import__("json").loads(pathlib.Path("assets/data/catalogue-index.json").read_text(encoding="utf-8"))
          brands_data = __import__("json").loads(pathlib.Path("assets/data/brands.json").read_text(encoding="utf-8"))
          categories_data = __import__("json").loads(pathlib.Path("assets/data/categories.json").read_text(encoding="utf-8"))
          vehicles_data = __import__("json").loads(pathlib.Path("assets/data/vehicles.json").read_text(encoding="utf-8"))
          expected = {
              "products": sum(p.get("active") is not False for p in catalogue) * 3,
              "brands": sum(b.get("active") is not False for b in brands_data) * 3,
              "categories": sum(c.get("active") is not False for c in categories_data) * 3,
              "vehicles": sum(v.get("active") is not False for v in vehicles_data) * 3,
          }
          products = len(re.findall(r"<loc>https://www\.souviks\.co\.in/(?:en|hi|bn)/products/", pathlib.Path("sitemaps/products.xml").read_text(encoding="utf-8")))
          brands = len(re.findall(r"<loc>https://www\.souviks\.co\.in/(?:en|hi|bn)/brands/", pathlib.Path("sitemaps/brands.xml").read_text(encoding="utf-8")))
          categories = len(re.findall(r"<loc>https://www\.souviks\.co\.in/(?:en|hi|bn)/categories/", pathlib.Path("sitemaps/categories.xml").read_text(encoding="utf-8")))
          vehicles = len(re.findall(r"<loc>https://www\.souviks\.co\.in/(?:en|hi|bn)/vehicles/", pathlib.Path("sitemaps/vehicles.xml").read_text(encoding="utf-8")))
          actual = {"products": products, "brands": brands, "categories": categories, "vehicles": vehicles}
          if actual != expected:
              print("Sitemap count mismatch")
              print("Expected:", expected)
              print("Actual:", actual)
              sys.exit(1)
          print("Sitemap integrity OK")
