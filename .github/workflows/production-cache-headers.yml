name: Production Cache Headers

on:
  pull_request:
    paths:
      - "_headers"
      - "scripts/audit/production_cache_headers.mjs"
      - ".github/workflows/production-cache-headers.yml"
  push:
    branches:
      - main
    paths:
      - "_headers"
      - "scripts/audit/production_cache_headers.mjs"
      - ".github/workflows/production-cache-headers.yml"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cache-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-headers:
    name: Verify live Cache-Control policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Inspect production response headers
        env:
          SOUVIKS_PRODUCTION_BASE_URL: https://www.souviks.co.in
        run: node scripts/audit/production_cache_headers.mjs
