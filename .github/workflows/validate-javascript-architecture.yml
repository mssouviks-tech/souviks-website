name: Validate JavaScript Architecture

on:
  workflow_run:
    workflows: ["Build Static Catalogue"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest published main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate JavaScript architecture
        run: python3 scripts/js/validate.py

      - name: Report code quality debt
        run: python3 scripts/audit/code_quality.py
