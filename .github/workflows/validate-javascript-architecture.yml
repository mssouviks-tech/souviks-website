name: Validate JavaScript Architecture

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "en/*.html"
      - "bn/*.html"
      - "hi/*.html"
      - "scripts/js/**"
      - "scripts/audit/**"
      - "supabase/migrations/**"
      - "_headers"
      - "_redirects"
      - ".github/workflows/validate-javascript-architecture.yml"
  pull_request:
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "en/*.html"
      - "bn/*.html"
      - "hi/*.html"
      - "scripts/js/**"
      - "scripts/audit/**"
      - "supabase/migrations/**"
      - "_headers"
      - "_redirects"
      - ".github/workflows/validate-javascript-architecture.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript architecture
        run: python3 scripts/js/validate.py

      - name: Validate RFQ security boundary
        run: python3 scripts/audit/rfq_security.py

      - name: Validate source performance budgets
        run: python3 scripts/audit/performance_guard.py


      - name: Report code quality debt
        run: python3 scripts/audit/code_quality.py
