name: Production Deployment Smoke

on:
  workflow_run:
    workflows: ["Build Static Catalogue"]
    types: [completed]
    branches: [main]
  # Re-run the smoke when its diagnostics or HTTP verification code changes,
  # without requiring an unrelated catalogue rebuild.
  push:
    branches: [main]
    paths:
      - "scripts/regression/production-browser-smoke.cjs"
      - "scripts/audit/production_smoke.py"
      - ".github/workflows/production-deployment-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: souviks-production-deployment-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JavaScript build tools and Playwright
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Wait for Cloudflare Pages to deploy the latest main revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/audit/production_smoke.py --wait-only

      # Exercise the exact deployed production build via its Pages hostname so the
      # zone-level challenge on the public custom domain does not block the browser.
      # The next HTTP smoke step still verifies the public custom domain and headers.
      - name: Test deployed desktop/mobile navigation and guest RFQ interactions
        env:
          PRODUCTION_BASE_URL: https://souviks-website.pages.dev
        run: node scripts/regression/production-browser-smoke.cjs

      - name: Verify live HTTP routes, headers, redirects, sitemaps, 404 and main revision
        if: always()
        env:
          PRODUCTION_BASE_URL: https://www.souviks.co.in
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/audit/production_smoke.py