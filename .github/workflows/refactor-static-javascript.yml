name: Refactor Static JavaScript

on:
  pull_request:
    paths:
      - 'scripts/js/refactor.py'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'en/*.html'
      - 'bn/*.html'
      - 'hi/*.html'
      - '.github/workflows/refactor-static-javascript.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate validations per PR; a push on another PR must not cancel these checks.
  group: souviks-static-js-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JavaScript build tools
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Refactor and validate candidate
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/js/refactor.py
          python3 scripts/js/validate.py
          npm run lint:js
          npm run check:js
          npm run format:check

          echo "JavaScript architecture candidate validated. Publishing is owned by Build Static Catalogue."
