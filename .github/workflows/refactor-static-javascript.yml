name: Refactor Static JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'scripts/js/refactor.py'
      - 'assets/js/bundles/**'
      - '.github/workflows/refactor-static-javascript.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: souviks-js-refactor
  cancel-in-progress: false

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run deterministic refactor
        run: python3 scripts/js/refactor.py

      - name: Syntax-check JavaScript
        run: |
          set -e
          for file in assets/js/site-core.js assets/js/bundles/*.js; do
            node --check "$file"
          done

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No JavaScript architecture changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor shared JavaScript runtime"
          git push origin main
