name: PR Preview Performance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - ".github/workflows/pr-preview-performance.yml"
      - ".github/workflows/performance-monitor.yml"
      - ".lighthouserc.json"
      - "assets/images/hero/**"
      - "assets/data/**"
      - "scripts/audit/**"
      - "scripts/catalogue/**"
      - "scripts/js/**"
      - "scripts/regression/**"

permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

concurrency:
  group: souviks-preview-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
    steps:
      - name: Classify browser-visible performance changes
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );
            const runtimeData = new Set([
              "assets/data/catalogue-index.json",
              "assets/data/catalogue-browse.json",
              "assets/data/products.json",
              "assets/data/search.json",
              "assets/data/brands.json",
              "assets/data/categories.json",
              "assets/data/vehicles.json"
            ]);
            const measurementFiles = new Set([
              ".lighthouserc.json",
              "scripts/regression/lcp-diagnostic.mjs",
              "scripts/regression/lighthouse-performance-gate.py"
            ]);
            const relevant = files
              .map(file => file.filename)
              .filter(path =>
                /(^|\/)[^/]+\.html$/i.test(path) ||
                path.startsWith("assets/js/") ||
                path.startsWith("assets/css/") ||
                path.startsWith("assets/images/hero/") ||
                path.startsWith("assets/images/products/") ||
                runtimeData.has(path) ||
                measurementFiles.has(path)
              );
            core.info(
              relevant.length
                ? "Browser-visible files changed:\n" + relevant.join("\n")
                : "No browser-delivered page, stylesheet, script, performance image or catalogue data changed. Lighthouse A/B is not applicable to this PR revision."
            );
            core.setOutput("runtime_changed", String(relevant.length > 0));

  lighthouse:
    needs: changes
    if: ${{ needs.changes.outputs.runtime_changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for generated LCP assets on the PR branch
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          # The catalogue release gate builds responsive assets and publishes them
          # from the real PR head. Wait for that output before measuring either the
          # local candidate or the Cloudflare branch preview.
          # Catalogue candidate generation is a full-site build and can exceed 20 minutes.
          # Leave time for Lighthouse itself after that publisher finishes.
          for attempt in $(seq 1 540); do
            git fetch --no-tags --depth=1 origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
            candidate_sha="$(git rev-parse "refs/remotes/origin/${PR_HEAD_REF}")"
            export CANDIDATE_SHA="${candidate_sha}"

            if python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          sha = os.environ["CANDIDATE_SHA"]

          def show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{sha}:{path}"])

          try:
              hero_avif = show("assets/images/hero/index-hero-mobile-crop.avif")
              hero_webp = show("assets/images/hero/index-hero-mobile-crop.webp")
              supabase_loader = show("assets/js/supabase-loader.js")
              cart_runtime = show("assets/js/cart/cart.js")
              browse_payload = show("assets/data/catalogue-browse.json")
              master_payload = show("assets/data/catalogue-index.json")
          except subprocess.CalledProcessError:
              sys.exit(1)

          # The listing now uses a generated compact projection. Do not run
          # a performance comparison against the temporary full-master fallback.
          try:
              browse_records = json.loads(browse_payload)
          except (UnicodeDecodeError, json.JSONDecodeError):
              sys.exit(1)
          if (
              not isinstance(browse_records, list)
              or not browse_records
              or len(browse_payload) >= len(master_payload)
          ):
              sys.exit(1)

          # The performance run serves checked-in runtimes directly. Do not
          # proceed with an old minified loader just because the hero images
          # already exist from an earlier PR.
          try:
              supabase_loader_text = supabase_loader.decode("utf-8")
          except UnicodeDecodeError:
              sys.exit(1)
          if "fetchPublicTable" not in supabase_loader_text:
              sys.exit(1)

          loader_hash = hashlib.sha256(supabase_loader).hexdigest()[:12]
          if (
              b"begin_checkout" not in cart_runtime
              or b"souviks:ga4-purchase-context:" not in cart_runtime
          ):
              sys.exit(1)
          cart_hash = hashlib.sha256(cart_runtime).hexdigest()[:12]
          for language in ("en", "hi", "bn"):
              path = f"{language}/products/10-x-15-nut.html"
              try:
                  html = show(path).decode("utf-8")
              except (subprocess.CalledProcessError, UnicodeDecodeError):
                  sys.exit(1)
              if f"supabase-loader.js?v={loader_hash}" not in html:
                  sys.exit(1)
              if f"cart/cart.js?v={cart_hash}" not in html:
                  sys.exit(1)

          if max(len(hero_avif), len(hero_webp)) > 80_000:
              sys.exit(1)

          avif_hash = hashlib.sha256(hero_avif).hexdigest()[:12]
          webp_hash = hashlib.sha256(hero_webp).hexdigest()[:12]
          for path in ("index.html", "en/index.html", "hi/index.html", "bn/index.html"):
              try:
                  html = show(path).decode("utf-8")
              except (subprocess.CalledProcessError, UnicodeDecodeError):
                  sys.exit(1)
              if f"index-hero-mobile-crop.avif?v={avif_hash}" not in html:
                  sys.exit(1)
              if f"index-hero-mobile-crop.webp?v={webp_hash}" not in html:
                  sys.exit(1)
              tags = re.findall(r"<link[^>]*>", html, flags=re.I)
              preload = [
                  tag for tag in tags
                  if 'rel="preload"' in tag
                  and 'as="image"' in tag
                  and "index-hero-mobile-crop.avif" in tag
                  and 'type="image/avif"' in tag
                  and 'media="(max-width: 768px)"' in tag
              ]
              if len(preload) != 1:
                  sys.exit(1)

          for language in ("en", "hi", "bn"):
              path = f"{language}/products.html"
              try:
                  html = show(path).decode("utf-8")
              except (subprocess.CalledProcessError, UnicodeDecodeError):
                  sys.exit(1)
              tags = re.findall(r"<link[^>]*>", html, flags=re.I)
              preload = [
                  tag for tag in tags
                  if 'rel="preload"' in tag
                  and 'as="image"' in tag
                  and "product-hero-mobile" in tag
              ]
              if len(preload) != 1 or "product-hero-mobile-crop.avif" not in preload[0]:
                  sys.exit(1)
          PY
            then
              git checkout --detach "${candidate_sha}"
              echo "Testing generated PR head ${candidate_sha} with current responsive LCP assets, Supabase public-review runtime and GA4 cart runtime."
              exit 0
            fi

            echo "Generated LCP assets, compact browse data or compiled Supabase/GA4 cart runtimes are not committed yet (attempt ${attempt}/540); waiting for the catalogue release gate."
            sleep 10
          done

          echo "The PR branch did not receive the validated responsive LCP assets within ninety minutes."
          exit 1

      - name: Set up Node for browser-level LCP diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright Chromium for LCP diagnostics
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@latest
          npx playwright install chromium

      - name: Start local main and PR preview servers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          git worktree add --detach /tmp/souviks-baseline FETCH_HEAD
          echo "Baseline main revision: $(git -C /tmp/souviks-baseline rev-parse HEAD)"
          echo "Candidate PR revision: $(git rev-parse HEAD)"

          python3 -m http.server 4173 --directory /tmp/souviks-baseline >/tmp/souviks-baseline-http.log 2>&1 &
          echo $! >/tmp/souviks-baseline-http.pid
          python3 -m http.server 4174 --directory "$GITHUB_WORKSPACE" >/tmp/souviks-candidate-http.log 2>&1 &
          echo $! >/tmp/souviks-candidate-http.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null \
              && curl -fsS http://127.0.0.1:4173/en/products.html >/dev/null \
              && curl -fsS http://127.0.0.1:4173/en/products/10-x-15-nut.html >/dev/null \
              && curl -fsS http://127.0.0.1:4174/ >/dev/null \
              && curl -fsS http://127.0.0.1:4174/en/products.html >/dev/null \
              && curl -fsS http://127.0.0.1:4174/en/products/10-x-15-nut.html >/dev/null; then
              echo "Baseline and candidate static routes are ready."
              exit 0
            fi
            sleep 1
          done

          echo "Local Lighthouse servers did not become ready."
          cat /tmp/souviks-baseline-http.log /tmp/souviks-candidate-http.log
          exit 1

      - name: Run three-run mobile Lighthouse A/B (main vs PR)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/en/products.html
            http://127.0.0.1:4173/en/products/10-x-15-nut.html
            http://127.0.0.1:4174/
            http://127.0.0.1:4174/en/products.html
            http://127.0.0.1:4174/en/products/10-x-15-nut.html
          configPath: .lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
          runs: 3

      - name: Wait for a matching Cloudflare Pages preview
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const shortSha = sha.slice(0, 7);
            const deadline = Date.now() + 15 * 60 * 1000;

            const branchPreviewFromComment = body => {
              const latest = body.match(/Latest commit:[\s\S]*?<code>([0-9a-f]{7,40})<\/code>/i);
              if (!latest || !sha.startsWith(latest[1].toLowerCase())) return null;
              if (!/Deploy successful!/i.test(body)) return null;
              const match = body.match(/Branch Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i)
                || body.match(/Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i);
              return match ? match[1].replace(/\/$/, "") : null;
            };

            while (Date.now() < deadline) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const deployments = checks.check_runs
                .filter(check => check.name === "Cloudflare Pages")
                .sort((a, b) => Date.parse(b.started_at || b.created_at) - Date.parse(a.started_at || a.created_at));
              const deployment = deployments[0];

              if (deployment?.status === "completed" && deployment.conclusion !== "success") {
                core.info(`Cloudflare Pages preview failed for ${shortSha}: ${deployment.conclusion}`);
              } else if (deployment?.status === "completed" && deployment.conclusion === "success") {
                const summary = deployment.output?.summary || "";
                const match = summary.match(/Branch Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i)
                  || summary.match(/Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i);
                if (match) {
                  const url = match[1].replace(/\/$/, "");
                  core.setOutput("url", url);
                  core.info(`Using successful Cloudflare Pages preview for ${shortSha}: ${url}`);
                  return;
                }
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const matchingComment = comments
                .filter(comment => /Cloudflare Pages/i.test(comment.body || ""))
                .sort((a, b) => Date.parse(b.updated_at || b.created_at) - Date.parse(a.updated_at || a.created_at))
                .find(comment => branchPreviewFromComment(comment.body || ""));
              if (matchingComment) {
                const url = branchPreviewFromComment(matchingComment.body);
                core.setOutput("url", url);
                core.info(`Using Cloudflare's successful branch-preview comment for ${shortSha}: ${url}`);
                return;
              }

              core.info(`Waiting for a successful Cloudflare Pages deployment for ${shortSha}; current check: ${deployment?.status || "not published"} / ${deployment?.conclusion || "pending"}.`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            core.setFailed(`No successful Cloudflare Pages preview for ${shortSha} within fifteen minutes. The local main-vs-PR Lighthouse A/B results remain available; deployed-preview verification is still outstanding.`);

      - name: Verify candidate cache headers on Cloudflare preview
        if: ${{ steps.preview.outputs.url != '' }}
        env:
          SOUVIKS_PRODUCTION_BASE_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/audit/production_cache_headers.mjs

      - name: Run mobile Lighthouse on deployed branch preview
        if: ${{ steps.preview.outputs.url != '' }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/en/products
            ${{ steps.preview.outputs.url }}/en/products/10-x-15-nut
          configPath: .lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
          runs: 3

      - name: Capture browser-level LCP timing and paint checkpoints
        if: ${{ success() }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "main=http://127.0.0.1:4173/"
            "main=http://127.0.0.1:4173/en/products.html"
            "main=http://127.0.0.1:4173/en/products/10-x-15-nut.html"
            "PR=http://127.0.0.1:4174/"
            "PR=http://127.0.0.1:4174/en/products.html"
            "PR=http://127.0.0.1:4174/en/products/10-x-15-nut.html"
          )
          if [ -n "${PREVIEW_URL:-}" ]; then
            args+=("preview=${PREVIEW_URL}/")
            args+=("preview=${PREVIEW_URL}/en/products")
            args+=("preview=${PREVIEW_URL}/en/products/10-x-15-nut")
          fi
          node scripts/regression/lcp-diagnostic.mjs "${args[@]}"

      - name: Summarize Lighthouse A/B and preview measurements
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path
          from urllib.parse import urlsplit

          def lcp_render_delay(report):
              details = (report.get("audits", {}).get("largest-contentful-paint-element") or {}).get("details") or {}
              for block in details.get("items") or []:
                  if block.get("type") != "table":
                      continue
                  headings = block.get("headings") or []
                  if not any(item.get("label") == "Phase" for item in headings):
                      continue
                  for item in block.get("items") or []:
                      if item.get("phase") == "Render Delay" and isinstance(item.get("timing"), (int, float)):
                          return float(item["timing"])
              return None

          groups = {}
          for path in Path(".lighthouseci").glob("*.report.json"):
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(report, dict):
                      continue
              except (OSError, json.JSONDecodeError):
                  continue

              url = report.get("requestedUrl") or report.get("finalUrl") or ""
              audits = report.get("audits") or {}
              score = (report.get("categories", {}).get("performance") or {}).get("score")
              lcp = (audits.get("largest-contentful-paint") or {}).get("numericValue")
              if not url or score is None or lcp is None:
                  continue

              parsed = urlsplit(url)
              if parsed.port == 4173:
                  group = "main"
              elif parsed.port == 4174:
                  group = "PR"
              elif parsed.hostname and parsed.hostname.endswith(".souviks-website.pages.dev"):
                  group = "deployed preview"
              else:
                  continue

              pathpart = parsed.path.rstrip("/")
              if pathpart in ("", "/"):
                  route = "Homepage"
              elif pathpart.endswith("/en/products.html") or pathpart.endswith("/en/products"):
                  route = "Product listing"
              elif pathpart.endswith("/en/products/10-x-15-nut.html") or pathpart.endswith("/en/products/10-x-15-nut"):
                  route = "Product detail"
              else:
                  continue

              tbt = (audits.get("total-blocking-time") or {}).get("numericValue")
              render = lcp_render_delay(report)
              groups.setdefault((group, route), []).append({
                  "score": float(score) * 100,
                  "lcp": float(lcp) / 1000,
                  "render": render / 1000 if render is not None else None,
                  "tbt": float(tbt) / 1000 if isinstance(tbt, (int, float)) else None,
              })

          def median_field(values, field):
              numbers = [item[field] for item in values if item.get(field) is not None]
              return statistics.median(numbers) if numbers else None

          def show_seconds(value):
              return f"{value:.2f} s" if value is not None else "—"

          lines = [
              "## Mobile Lighthouse results",
              "",
              "These reports retain Lighthouse's standard simulated-mobile throttling for a controlled baseline and route-regression comparison.",
              "The separate browser diagnostics use CDP 3G network emulation and 4x CPU slowdown. The hard 4.0s listing gate uses the final browser-observed PerformanceObserver LCP event, not Lighthouse's simulated projection.",
              "Render delay is the LCP time spent after resource loading; TBT is included as a separate main-thread blocking signal.",
              "",
              "| Test | Route | Runs | Median performance | Median LCP | Median LCP render delay | Median TBT |",
              "|---|---|---:|---:|---:|---:|---:|"
          ]
          order = ["main", "PR", "deployed preview"]
          routes = ["Homepage", "Product listing", "Product detail"]
          for group in order:
              for route in routes:
                  values = groups.get((group, route), [])
                  if not values:
                      continue
                  score = median_field(values, "score")
                  lcp = median_field(values, "lcp")
                  render = median_field(values, "render")
                  tbt = median_field(values, "tbt")
                  lines.append(
                      f"| {group} | {route} | {len(values)} | {score:.0f} | "
                      f"{show_seconds(lcp)} | {show_seconds(render)} | {show_seconds(tbt)} |"
                  )

          if not any(key[0] in ("main", "PR") for key in groups):
              lines.extend(["", "**Warning:** No local Lighthouse reports were found in `.lighthouseci/`; check the action output and report directory."])
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Enforce three-run mobile Lighthouse performance gate
        run: python3 scripts/regression/lighthouse-performance-gate.py

      - name: Upload LCP paint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcp-paint-diagnostics-${{ github.run_id }}
          path: lcp-diagnostic/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preview-reports-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
