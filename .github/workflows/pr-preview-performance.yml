name: PR Preview Performance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "**/*.html"
      - ".github/workflows/pr-preview-performance.yml"
      - ".lighthouserc.json"

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: souviks-preview-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for the Cloudflare Pages branch preview
        id: preview
        uses: actions/github-script@v7
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const sha = process.env.PREVIEW_SHA;
            const deadline = Date.now() + 10 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const deployment = data.check_runs.find(check => check.name === "Cloudflare Pages");

              if (deployment?.status === "completed") {
                if (deployment.conclusion !== "success") {
                  core.setFailed(`Cloudflare Pages preview failed: ${deployment.conclusion}`);
                  return;
                }

                const summary = deployment.output?.summary || "";
                const match = summary.match(/Branch Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i)
                  || summary.match(/Preview URL:[\s\S]*?<a href=['"]([^'"]+)['"]/i);
                if (!match) {
                  core.setFailed("Cloudflare Pages completed, but no preview URL was exposed in its check summary.");
                  return;
                }

                const baseUrl = match[1].replace(/\/$/, "");
                core.setOutput("url", baseUrl);
                core.info(`Using deployed branch preview: ${baseUrl}`);
                return;
              }

              core.info("Waiting for Cloudflare Pages preview deployment to complete...");
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            core.setFailed("Timed out waiting for the Cloudflare Pages preview check.");

      - name: Run three mobile Lighthouse measurements per route
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/en/products
            ${{ steps.preview.outputs.url }}/en/products/10-x-15-nut
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 3
